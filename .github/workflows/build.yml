name: Build Desktop App

on:
  push:
    tags:
      - 'v*' # Se déclenche dès que tu pousses un tag (ex: v1.0.0)

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 📥 Récupération du code
      uses: actions/checkout@v4

    - name: 🐍 Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        pip install pyinstaller pywebview

    - name: 🔨 Compilation avec PyInstaller
      run: |
        pyinstaller --name "TechFiveLabels" --noconsole --icon="data/favicon.ico" --add-data "data;data" main.py

    - name: 📦 Compression du dossier de build
      run: |
        Compress-Archive -Path "dist/TechFiveLabels" -DestinationPath "TechFiveLabels-Windows.zip"

    - name: 🚀 Publication de la Release sur GitHub
      uses: softprops/action-gh-release@v1
      with:
        files: TechFiveLabels-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}