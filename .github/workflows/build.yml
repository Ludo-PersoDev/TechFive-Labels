name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 🔄 Cloner le dépôt
      uses: actions/checkout@v4

    - name: 🐍 Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 🏷️ Générer le fichier de version depuis le tag Git
      run: |
        echo "VERSION = '${{ github.ref_name }}'" > version.py

    - name: 🔨 Compilation avec PyInstaller
      run: |
        python -m PyInstaller --name "TechFiveLabels" --noconsole --icon="data/favicon.ico" --add-data "data;data" main.py

    - name: 📥 Installer Inno Setup
      run: |
        winget install JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements

    - name: 📦 Création de l'installeur avec Inno Setup
      run: |
        # Chemin standard d'Inno Setup installé via winget
        $iscc = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
        & $iscc installer.iss
      shell: pwsh
      
    - name: 🚀 Publier la Release sur GitHub
      uses: softprops/action-gh-release@v1
      with:
        files: |
          installer_output/TechFiveLabels_Setup.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}