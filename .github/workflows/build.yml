name: Build Desktop App

on:
  push:
    tags:
      - 'v*'

# 👈 C'est ici qu'on donne l'autorisation d'écriture au workflow
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 📥 Récupération du code
      uses: actions/checkout@v4

    - name: 🐍 Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        pip install pyinstaller pywebview

    - name: 🏷️ Générer le fichier de version depuis le tag Git
      run: |
        echo "VERSION = '${{ github.ref_name }}'" > version.py

    - name: 🔨 Compilation avec PyInstaller
      run: |
        pyinstaller --name "TechFiveLabels" --noconsole --icon="data/favicon.ico" --add-data "data;data" main.py
        
    - name: 🚀 Publication de l'executable sur GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: dist/TechFiveLabels/TechFiveLabels.exe # 👈 On cible directement l'exe final
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}